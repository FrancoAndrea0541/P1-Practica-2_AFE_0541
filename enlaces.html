<!DOCTYPE html>
<html lang="en">
<!--define el idioma del html-->

<head>
    <meta charset="UTF-8">
      <!--permite que los acentos y la ñ se pueda usar en el html-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Sirve para ajustar la pagina dependiendo del dipositivo donde se este usando la página web -->
    <title>Enlaces en HTML</title>
    <!-- titulo de la pagina web -->
    
</head>
<body>
    <h2>Tipos de enlaces en HTML</h2>
    <!--es un subtitulo-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <!-- strong pone las letras en cursiva -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- se pone el vinculo-->
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <!-- target se usa en los enlaces para indicar dónde se debe abrir la página -->
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <!-- target_blank abre el enlace en una pestaña o ventana nueva del navegador -->
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <!-- target_self abre el enlace en la misma pestaña o marco actual. Es el valor por defecto -->
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <!--target_parent abre el enlace en el marco o contexto padre del elemento actual-->
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
    <!--target_top abre el enlace en toda la ventana del navegador, eliminando cualquier marco existente-->
</body>
</html>
