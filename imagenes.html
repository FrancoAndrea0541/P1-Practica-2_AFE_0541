<!DOCTYPE html>
<html lang="en">
<!--define el idioma del html-->
    
<head>
    <meta charset="UTF-8">
     <!--permite que los acentos y la ñ se pueda usar en el html-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sirve para ajustar la pagina dependiendo del dipositivo donde se este usando la página web -->
    <title>Imagenes en HTML</title>
    <!-- titulo de la pagina web -->
    
</head>
<body>
    <h2>Imagenes en HTML</h2>
    <!-- este es un subtitulo-->
    <h3>Locales</h3>
     <!-- este es un subtitulo-->
    <img src="caritas.png" alt="Imagen de carita feliz">
    <!-- img src indica la ruta o dirección URL del archivo de imagen este puede ser desde el explorador de archivos o desde del navegador-->
    <h3>Locales redismensionado</h3>
     <!-- este es un subtitulo-->
    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!--width y height cambian el ancho y la altura de la imagen-->
    <h3>Desde internet</h3>
     <!-- este es un subtitulo-->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <!-- alt muestra un texto alternativo que describe una imagen cuando esta no carga-->
    <h3>Animaciones</h3>
     <!-- este es un subtitulo-->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
</body>
</html>
